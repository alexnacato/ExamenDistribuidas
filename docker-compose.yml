# Examen Parcial 1 - Aplicaciones Distribuidas
# Docker Compose que ejecuta el servidor de chat dentro de un contenedor.
# Los clientes NO van en Docker: se ejecutan en terminales de VS Code.

services:
  servidor:
    build: .
    container_name: servidor_chat
    # Publicamos el puerto 8765 del contenedor en la computadora
    # anfitriona para que los clientes se conecten.
    ports:
      - "8765:8765"
    stdin_open: true
    tty: true
